# Phase 6 (T6.2) — sert le build Vite statique, SPA fallback vers index.html (routes
# côté client), assets hashés en cache long (immutable — Vite change le nom au contenu).
# NON vérifié contre un nginx réel dans ce sandbox (pas de démon Docker) — à valider au
# déploiement Dokploy (voir rapport de phase).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location ~* ^/admin(?:/|$) {
        return 302 /;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}

# Déploiement clé en main : `docker compose up -d --build`.
# Renseigner au minimum AUTH_SECRET, ACADEMY_WEBHOOK_SECRET, POSTGRES_PASSWORD,
# REDIS_PASSWORD dans un fichier `.env` à côté de ce fichier — Compose le charge automatiquement.
# Générer un secret : openssl rand -hex 32
services:
  bloomcore:
    build: .
    image: bloomcore:latest
    ports:
      - "${API_PORT:-4000}:4000"
    environment:
      NODE_ENV: production
      API_PORT: 4000
      # OBLIGATOIRE (min 16 car.) : le serveur refuse de démarrer sinon (S1).
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET requis - voir .env.example}
      # Obligatoire si le webhook École Bloom est utilisé (POST /api/v1/webhooks/academy).
      ACADEMY_WEBHOOK_SECRET: ${ACADEMY_WEBHOOK_SECRET:-}
      # Origines autorisées (CORS). Vide = tout bloqué en prod ; mettre l'URL du frontend
      # si servi depuis un autre domaine. Le déploiement mono-service (même origine) n'en a pas besoin.
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      APP_URL: ${APP_URL:-http://localhost:4000}
      # M6 — backend Postgres. L'entrypoint applique `prisma migrate deploy` au boot,
      # puis le serveur importe une fois les données SQLite existantes (migrateFromSqlite,
      # gardé par le flag _m6_migrated). Absent → mode SQLite legacy inchangé.
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-bloom}@db:5432/bloomcore?schema=public
      # Consommé par server/rateLimit.ts (anti-brute-force partagé), server/auth.ts (cache
      # pwd_version) et server/stream.ts (pub/sub poke() multi-instance) — Phase 2.
      REDIS_URL: redis://:${REDIS_PASSWORD:-bloom}@redis:6379
      # SQLite persisté sur le volume nommé ci-dessous — tables auxiliaires
      # (credentials/tokens/…) même en mode Postgres.
      BLOOMCORE_DB: /data/bloomcore.db
      # Défini UNIQUEMENT pour un environnement de test/démo : seed des credentials + des
      # 18 profils de test (mem_test_*). Laisser vide pour une vraie prod (activation requise).
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:-}
      # Phase 3 (T3.2) : le scheduler tourne dans le service worker dédié ci-dessous —
      # désactivé ici pour ne pas dérouler le sweep (et donc les emails/SMS) deux fois.
      RUN_SCHEDULER: "false"
      # Phase 5 (T5.1-T5.3) : MinIO S3-compatible pour les photos. LAISSER VIDE pour rester
      # en mode disque (comportement historique, /data/uploads sur le volume ci-dessous) —
      # définir les 4 variables ci-dessous bascule automatiquement server/storage.ts en mode
      # S3 (voir ce fichier pour le détail). Le bucket doit exister AVANT le premier upload :
      # le service `uploads-bucket` ci-dessous le crée une fois au démarrage.
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-bloomcore}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
    volumes:
      - bloomcore-data:/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Phase 3 (T3.2) : process dédié au scheduler (alertes temporelles + drain outbox),
  # séparé de l'API pour scaler l'API (replicas) sans dupliquer les sweeps. Même image
  # que bloomcore (même code, autre commande) — voir server/worker.ts. Dépend de Redis
  # (le pub/sub SSE est ce qui relaie ses poke() vers les clients connectés à l'API).
  worker:
    build: .
    image: bloomcore:latest
    # `command:` remplace le CMD du Dockerfile (qui applique `prisma migrate deploy`) —
    # le refaire ici : sinon rien ne garantit que le schéma est prêt avant que ce
    # service ne lise/écrive en base (démarrage worker/api en parallèle, pas d'ordre
    # garanti par depends_on au-delà du healthcheck Postgres lui-même).
    command: ["sh", "-c", "if [ -n \"$$DATABASE_URL\" ]; then npx prisma migrate deploy; fi && exec npx tsx server/worker.ts"]
    # Le HEALTHCHECK du Dockerfile (wget /api/v1/health sur :4000) est hérité par ce
    # conteneur — or le worker n'a AUCUN serveur HTTP : il serait marqué unhealthy en
    # permanence (faux positif d'incident dans Dokploy/Kuma). Neutralisé explicitement.
    healthcheck:
      disable: true
    environment:
      NODE_ENV: production
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET requis - voir .env.example}
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-bloom}@db:5432/bloomcore?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:-bloom}@redis:6379
      BLOOMCORE_DB: /data/bloomcore.db
    volumes:
      - bloomcore-data:/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bloom}
      POSTGRES_DB: bloomcore
    volumes:
      - bloomcore-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bloomcore"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # requirepass : jamais de Redis ouvert sans mot de passe, même sur réseau interne.
    # appendonly : persistance AOF — les compteurs/révocations survivent à un redémarrage.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-bloom}", "--appendonly", "yes"]
    volumes:
      - bloomcore-redis:/data
    healthcheck:
      # Substitution côté Compose (un seul $) : le conteneur redis n'a pas REDIS_PASSWORD
      # dans son environnement (seule la "command" le reçoit), donc $$VAR (substitution
      # shell côté conteneur) s'évaluait en chaîne vide → auth refusée → faux "unhealthy".
      test: ["CMD-SHELL", "redis-cli -a '${REDIS_PASSWORD:-bloom}' ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Sauvegarde Postgres — pg_dump quotidien + rétention locale (voir scripts/backup-postgres.sh
  # pour le détail, scripts/restore-postgres.sh pour restaurer). Protège contre une erreur
  # applicative, une migration ratée ou une suppression accidentelle (volume bloomcore-backups
  # séparé du volume Postgres actif).
  #
  # Copie hors-site (Cloudflare R2) — OPTIONNEL, activé dès que les 4 variables R2_* ci-dessous
  # sont renseignées (sinon sauvegarde locale seule, comportement inchangé). Sans ça, le volume
  # local NE PROTÈGE PAS une perte du serveur/hôte lui-même (même machine). Pour activer :
  #   1. Créer un compte Cloudflare (gratuit) puis un bucket R2 (Stockage R2 → Créer un bucket).
  #   2. R2 → Gérer les jetons d'API R2 → créer un jeton avec permission "Lecture et écriture
  #      d'objets", limité à ce bucket → donne R2_ACCESS_KEY_ID et R2_SECRET_ACCESS_KEY.
  #   3. R2_ACCOUNT_ID : visible sur la page d'accueil R2 du dashboard Cloudflare (colonne de
  #      droite) ou dans l'URL du jeton créé.
  #   4. R2_BUCKET : le nom donné au bucket à l'étape 1.
  # 10 Go gratuits, aucun frais de sortie — largement suffisant pour des dumps SQL compressés.
  backup:
    image: postgres:16-alpine
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-bloom}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_RETENTION_DAYS: ${R2_RETENTION_DAYS:-90}
    volumes:
      - bloomcore-backups:/backups
      - ./scripts/backup-postgres.sh:/backup.sh:ro
    entrypoint: ["sh", "/backup.sh"]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Monitoring uptime : pinger http://bloomcore:4000/api/v1/health depuis l'UI Kuma
  # (première connexion → créer le compte admin immédiatement). Exposer via un domaine
  # dédié (ex. status.votre-domaine) dans Dockploy/Traefik plutôt que le port brut.
  uptime-kuma:
    image: louislam/uptime-kuma:1
    ports:
      - "${KUMA_PORT:-3001}:3001"
    volumes:
      - bloomcore-kuma:/app/data
    restart: unless-stopped

  # Phase 5 : MinIO vit dans docker-compose.minio.yml (overlay OPT-IN, comme le frontend
  # nginx dans docker-compose.frontend.yml). Il était initialement déclaré ICI avec
  # `${S3_SECRET_KEY:?...}` — mais l'interpolation `:?` de Compose échoue au PARSING du
  # fichier, pas au démarrage du service : tout `docker compose up` sans S3_SECRET_KEY
  # (donc le déploiement Dokploy actuel, sans variables S3) aurait cassé net. Déplacé.

volumes:
  bloomcore-data:
  bloomcore-pg:
  bloomcore-redis:
  bloomcore-kuma:
  bloomcore-backups:

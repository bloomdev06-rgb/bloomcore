# Phase 5 (T5.1) — overlay OPT-IN pour le stockage objet MinIO, à combiner avec
# docker-compose.yml :
#   docker compose -f docker-compose.yml -f docker-compose.minio.yml up -d --build
#
# Le déploiement par défaut (docker-compose.yml seul) reste en mode disque, INCHANGÉ.
# Activer MinIO exige de définir dans .env : S3_ENDPOINT=http://minio:9000,
# S3_ACCESS_KEY, S3_SECRET_KEY (fort — c'est le mot de passe root MinIO), et
# éventuellement S3_BUCKET (défaut : bloomcore). Le service bloomcore lit déjà ces
# variables (voir docker-compose.yml) — server/storage.ts bascule en mode S3 dès que
# S3_ENDPOINT est défini. Après activation sur un déploiement existant, migrer les
# photos déjà sur disque : `npx tsx server/migrate-uploads.ts` (terminal du conteneur).
services:
  # PAS de port public (accès réseau interne seul) — la console 9001 uniquement via un
  # domaine Dokploy dédié si besoin d'y accéder depuis l'extérieur.
  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-bloomcore}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?S3_SECRET_KEY requis pour l'overlay MinIO - voir .env.example}
    volumes:
      - bloomcore-minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # One-shot : crée le bucket S3_BUCKET s'il n'existe pas encore, puis sort (code 0).
  # `mc alias`/`mc mb` sont idempotents — ré-exécutable sans risque à chaque `docker compose up`.
  uploads-bucket:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-bloomcore}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-bloomcore}
    entrypoint: ["sh", "-c", "mc alias set local http://minio:9000 \"$$S3_ACCESS_KEY\" \"$$S3_SECRET_KEY\" && mc mb --ignore-existing \"local/$$S3_BUCKET\""]
    restart: "no"

volumes:
  bloomcore-minio:

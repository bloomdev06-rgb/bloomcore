name: CI

on:
  push:
    # main seul à l'origine : la CI ne tournait jamais sur les branches réellement
    # déployées (Dokploy suivait m6-relational, puis separation-deploy).
    branches: [main, m6-relational, separation-deploy]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.5'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
